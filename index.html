<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рамантызм — тэст</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07070b;--card:#101017;--purple:#8b5cf6;--purple2:#6d28d9;--text:#f5f3ff;--muted:#a7a1b8;--border:#272333}
body{
  margin:0; min-height:100vh; font-family:Arial,sans-serif;
  background:radial-gradient(circle at 50% 0%,#21113d 0%,#0d0915 30%,#07070b 65%);
  color:var(--text); display:flex; align-items:center; justify-content:center;
}
.container{width:min(760px,100%);padding:22px}
.card{
  background:rgba(16,16,23,.96); border:1px solid var(--border);
  border-radius:24px; padding:34px; box-shadow:0 20px 70px rgba(88,35,170,.22);
}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.badge{color:#c4b5fd;font-size:14px;font-weight:700}
.counter{color:var(--muted);font-size:14px}
.progress{height:5px;background:#211d2b;border-radius:99px;overflow:hidden;margin:0 0 34px}
.progress div{height:100%;background:linear-gradient(90deg,var(--purple2),var(--purple));transition:width .35s}
h1{font-size:30px;line-height:1.2;margin:0 0 15px}
.question{font-size:24px;line-height:1.4;margin:0 0 25px}
.answers{display:grid;gap:12px}
.answer{
  width:100%; text-align:left; padding:17px 18px; border-radius:15px;
  border:1px solid #302a3d; background:#15131d; color:var(--text);
  font-size:16px; cursor:pointer; transition:.18s;
}
.answer:hover{border-color:var(--purple);background:#1b1628;transform:translateY(-1px)}
.answer.correct{border-color:#7c3aed;background:#241344}
.answer.wrong{border-color:#a855f7;background:#251426}
.answer:disabled{cursor:default;transform:none}
.next{
  margin-top:20px;width:100%;padding:15px;border:0;border-radius:14px;
  background:linear-gradient(90deg,var(--purple2),var(--purple));color:white;
  font-size:17px;font-weight:700;cursor:pointer;display:none;
}
.next:hover{filter:brightness(1.1)}
.result{text-align:center}
.result h2{font-size:30px;margin-top:0}
.score{font-size:58px;font-weight:800;color:#c4b5fd;margin:20px 0}
.result p{color:var(--muted);font-size:17px}
.restart{display:block;margin-top:25px;text-decoration:none;text-align:center}

/* Эффекты ответа */
@keyframes correctPop{
  0%{transform:scale(1);box-shadow:0 0 0 rgba(139,92,246,0)}
  45%{transform:scale(1.03);box-shadow:0 0 30px rgba(139,92,246,.55)}
  100%{transform:scale(1);box-shadow:0 0 18px rgba(139,92,246,.25)}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(5px)}
}
@keyframes glowIn{
  from{opacity:0;transform:scale(.96)}
  to{opacity:1;transform:scale(1)}
}
.answer.correct{
  animation:correctPop .55s ease;
  border-color:#a78bfa!important;
  background:linear-gradient(135deg,#28134d,#321866)!important;
  box-shadow:0 0 22px rgba(139,92,246,.35);
}
.answer.wrong{
  animation:wrongShake .45s ease;
  border-color:#c084fc!important;
  background:#30152c!important;
}
.answer.correct::after{content:"  ✓";float:right;font-size:20px;color:#c4b5fd}
.answer.wrong::after{content:"  ✕";float:right;font-size:20px;color:#e9d5ff}
.answer:not(:disabled):hover{box-shadow:0 0 16px rgba(139,92,246,.18)}
.card{animation:glowIn .35s ease}
.feedback{
  margin-top:16px;padding:13px 16px;border-radius:13px;
  font-weight:700;text-align:center;animation:glowIn .25s ease;
}
.feedback.good{background:#211137;color:#d8b4fe;border:1px solid #6d28d9}
.feedback.bad{background:#2a1728;color:#e9d5ff;border:1px solid #9333ea}
@media(max-width:600px){
  .card{padding:23px;border-radius:20px}
  h1{font-size:25px}.question{font-size:20px}
  .answer{font-size:15px;padding:15px}
}
    
</style>
</head>
<body>
<div class="container"><div class="card" id="app"></div></div>

<script>
const questions = [
{q:"Што такое рамантызм?",o:["Мастацкі напрамак, які сфармаваўся на мяжы XVIII–XIX стагоддзяў у краінах Заходняй Еўропы","Літаратурны жанр, які ўзнік толькі ў XX стагоддзі","Музычны стыль Старажытнай Грэцыі","Мастацкі напрамак, які ўзнік толькі ў Беларусі"],a:0},
{q:"Які асноўны канфлікт ляжыць у цэнтры рамантызму?",o:["Паміж асобай і грамадствам","Паміж навукай і тэхнікай","Паміж двума дзяржавамі","Паміж прыродай і чалавекам"],a:0},
{q:"Якая галоўная ідэя рамантызму?",o:["Прызнанне каштоўнасці духоўна-творчага жыцця чалавека і яго права на незалежнасць і свабоду","Поўнае падпарадкаванне чалавека грамадству","Адмова ад асабістых пачуццяў","Перавага толькі матэрыяльных каштоўнасцей"],a:0},
{q:"Што такое рамантычны герой?",o:["Выключная асоба ў выключных абставінах, якая супрацьпастаўляе сябе недасканаламу свету","Звычайны чалавек, які цалкам прымае нормы грамадства","Гістарычны даследчык","Герой выключна камічнага твора"],a:0},
{q:"Што называецца рамантычным пафасам?",o:["Стан душы героя, выкліканы звышасабовымі ідэаламі і барацьбой з неспрыяльнымі абставінамі","Гумарыстычнае стаўленне да жыцця","Спосаб апісання прыроды","Сукупнасць гістарычных фактаў"],a:0},
{q:"Да чаго рамантыкі праяўлялі асаблівую цікавасць?",o:["Да гісторыі і фальклору","Толькі да дакладных навук","Толькі да сучаснай тэхнікі","Да эканамічнай статыстыкі"],a:0},
{q:"Хто з беларускіх пісьменнікаў названы ў матэрыяле як прадстаўнік рамантызму XIX стагоддзя?",o:["Адам Міцкевіч","Якуб Колас","Янка Купала","Максім Багдановіч"],a:0},
{q:"Які твор Адама Міцкевіча быў першай кнігай паэзіі, выдадзенай у Вільні ў 1822 годзе?",o:["«Паэзія»","«Пан Тадэвуш»","«Конрад Валенрод»","«Крымскія санеты»"],a:0},
{q:"Хто стварыў «Песеньку» («Лірнік вясковы»)?",o:["Ян Чачот","Ян Баршчэўскі","Адам Міцкевіч","Вінцэнт Дунін-Марцінкевіч"],a:0},
{q:"Якую мову Ян Чачот стаў актыўна ўжываць у побыце і літаратурнай дзейнасці?",o:["Беларускую","Толькі польскую","Толькі рускую","Лацінскую"],a:0},
{q:"Чаму выкарыстанне беларускай мовы Янам Чачотам было ўнікальным для яго часу?",o:["Беларуская мова лічылася «мужыцкай», а ў грамадстве пераважалі польская і руская мовы","Беларуская мова была дзяржаўнай мовай усёй Еўропы","Беларуская мова была забароненая ва ўсіх краінах Еўропы","Беларуская мова існавала толькі ў вуснай форме"],a:0},
{q:"Што сабраў і выдаў Ян Чачот?",o:["Зборнікі беларускіх народных песень","Зборнік навуковых артыкулаў па матэматыцы","Кнігу гістарычных карт","Зборнік замежных казак"],a:0},
{q:"Калі нарадзіўся Ян Чачот?",o:["7 ліпеня 1796 года","7 ліпеня 1816 года","18 жніўня 1798 года","1 студзеня 1809 года"],a:0},
{q:"З кім Ян Чачот сябраваў і быў звязаны падчас вучобы?",o:["З Адамам Міцкевічам","З Вінцэнтам Дуніным-Марцінкевічам","З Якубам Коласам","З Янкам Купалам"],a:0},
{q:"Калі памёр Ян Чачот?",o:["У 1847 годзе","У 1822 годзе","У 1863 годзе","У 1796 годзе"],a:0}
];

let quiz=[], current=0, score=0, locked=false;

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5)}

function start(){
  // Новы парадак пытанняў і адказаў пры кожным новым праходжанні.
  quiz=shuffle(questions).map(x=>{
    const options=x.o.map((text,index)=>({text,index}));
    const shuffled=shuffle(options);
    return {...x,o:shuffled.map(v=>v.text),a:shuffled.findIndex(v=>v.index===x.a)};
  });
  current=0; score=0; locked=false; showQuestion();
}

function showQuestion(){
  locked=false;
  const x=quiz[current];
  const percent=((current)/quiz.length)*100;
  document.getElementById("app").innerHTML=`
    <div class="top">
      <div class="badge">РАМАНТЫЗМ</div>
      <div class="counter">${current+1} / ${quiz.length}</div>
    </div>
    <div class="progress"><div style="width:${percent}%"></div></div>
    <h1>Праверка ведаў</h1>
    <p class="question">${x.q}</p>
    <div class="answers">
      ${x.o.map((v,i)=>`<button class="answer" onclick="choose(${i})">${v}</button>`).join("")}
    </div>
    <button class="next" id="next" onclick="nextQuestion()">Наступнае пытанне →</button>
  `;
}

function choose(i){
  if(locked)return;
  locked=true;
  const x=quiz[current];
  const buttons=document.querySelectorAll(".answer");
  buttons.forEach(b=>b.disabled=true);
  if(i===x.a){
    score++;
    buttons[i].classList.add("correct");
    const box=document.createElement("div");
    box.className="feedback good";
    box.textContent="✓ Правільна! Выдатна!";
    document.querySelector(".answers").after(box);
  } else {
    buttons[i].classList.add("wrong");
    buttons[x.a].classList.add("correct");
    const box=document.createElement("div");
    box.className="feedback bad";
    box.textContent="✕ Няправільна. Правільны адказ паказаны вышэй.";
    document.querySelector(".answers").after(box);
  }
  document.getElementById("next").style.display="block";
}

function nextQuestion(){
  current++;
  if(current>=quiz.length) showResult();
  else showQuestion();
}

function showResult(){
  const percent=Math.round(score/quiz.length*100);
  let msg=percent===100?"Выдатна! Усе адказы правільныя.":percent>=80?"Вельмі добры вынік!":percent>=60?"Добры вынік! Паўтары асноўныя паняцці і паспрабуй яшчэ раз.":"Паўтары матэрыял і паспрабуй яшчэ раз.";
  document.getElementById("app").innerHTML=`
    <div class="result">
      <div class="badge">ТЭСТ ЗАВЕРШАНЫ</div>
      <h2>Твой вынік</h2>
      <div class="score">${score}/${quiz.length}</div>
      <p>${percent}% правільных адказаў</p>
      <p>${msg}</p>
      <button class="restart" onclick="start()">↻ Прайсці яшчэ раз</button>
    </div>
  `;
}
start();
</script>

</body>
</html>
