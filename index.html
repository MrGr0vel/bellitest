<!DOCTYPE html>
<html lang="be">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рамантызм — тэст</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07070b;--card:#101017;--purple:#8b5cf6;--purple2:#6d28d9;--text:#f5f3ff;--muted:#a7a1b8;--border:#272333}
body{
  margin:0; min-height:100vh; font-family:Arial,sans-serif;
  background:radial-gradient(circle at 50% 0%,#21113d 0%,#0d0915 30%,#07070b 65%);
  color:var(--text); display:flex; align-items:center; justify-content:center;
}
.container{width:min(760px,100%);padding:22px}
.card{
  background:rgba(16,16,23,.96); border:1px solid var(--border);
  border-radius:24px; padding:34px; box-shadow:0 20px 70px rgba(88,35,170,.22);
}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.badge{color:#c4b5fd;font-size:14px;font-weight:700}
.counter{color:var(--muted);font-size:14px}
.progress{height:5px;background:#211d2b;border-radius:99px;overflow:hidden;margin:0 0 34px}
.progress div{height:100%;background:linear-gradient(90deg,var(--purple2),var(--purple));transition:width .35s}
h1{font-size:30px;line-height:1.2;margin:0 0 15px}
.question{font-size:24px;line-height:1.4;margin:0 0 25px}
.answers{display:grid;gap:12px}
.answer{
  width:100%; text-align:left; padding:17px 18px; border-radius:15px;
  border:1px solid #302a3d; background:#15131d; color:var(--text);
  font-size:16px; cursor:pointer; transition:.18s;
}
.answer:hover{border-color:var(--purple);background:#1b1628;transform:translateY(-1px)}
.answer.correct{border-color:#7c3aed;background:#241344}
.answer.wrong{border-color:#a855f7;background:#251426}
.answer:disabled{cursor:default;transform:none}
.next{
  margin-top:20px;width:100%;padding:15px;border:0;border-radius:14px;
  background:linear-gradient(90deg,var(--purple2),var(--purple));color:white;
  font-size:17px;font-weight:700;cursor:pointer;display:none;
}
.next:hover{filter:brightness(1.1)}
.result{text-align:center}
.result h2{font-size:30px;margin-top:0}
.score{font-size:58px;font-weight:800;color:#c4b5fd;margin:20px 0}
.result p{color:var(--muted);font-size:17px}
.restart{display:block;margin-top:25px;text-decoration:none;text-align:center}
@media(max-width:600px){
  .card{padding:23px;border-radius:20px}
  h1{font-size:25px}.question{font-size:20px}
  .answer{font-size:15px;padding:15px}
}
</style>
</head>
<body>
<div class="container"><div class="card" id="app"></div></div>

<script>
const questions = [
{q:"Дзе рамантызм як літаратурны напрамак сцвердзіў свае пазіцыі ў канцы XVIII стагоддзя?",o:["У Заходняй Еўропе","У Паўночнай Амерыцы","У Старажытнай Грэцыі","Толькі ў Беларусі"],a:0},
{q:"З наступствамі якой падзеі звязваецца ўзнікненне рамантызму ў тэксце?",o:["Французскай рэвалюцыі","Прамысловай рэвалюцыі ў Англіі","Кастрычніцкай рэвалюцыі","Першай сусветнай вайны"],a:0},
{q:"Што, паводле тэксту, узнікла ў адносінах да магчымасцей чалавечага розуму пасля расчаравання ў выніках рэвалюцыі?",o:["Расчараванне","Поўнае захапленне","Бязмежная ўпэўненасць","Абыякавасць"],a:0},
{q:"Які прынцып рамантызм супрацьпаставіў рацыяналізму Асветніцтва?",o:["Ірацыяналізм","Рэалізм","Класіцызм","Сентыменталізм"],a:0},
{q:"Што рамантызм прынёс у літаратуру як новы мастацкі метад?",o:["Прынцып індывідуальнасці і самабытнасці творчасці","Адмову ад пачуццяў","Толькі дакладнае апісанне фактаў","Адмову ад гісторыі"],a:0},
{q:"Што з'яўляецца адной з характэрных рыс рамантызму паводле тэксту?",o:["Культ пачуццяў","Поўнае падпарадкаванне героя грамадству","Адмова ад фантазіі","Перавага толькі навуковай тэматыкі"],a:0},
{q:"Да чаго рамантыкі праяўлялі асаблівую цікавасць?",o:["Да гісторыі і фальклору","Толькі да матэматыкі","Толькі да палітычных дакументаў","Да тэхнічных інструкцый"],a:0},
{q:"Які твор Адама Міцкевіча названы ў тэксце як першая кніга паэзіі, выдадзеная ў Вільні?",o:["«Паэзія» (1822)","«Пан Тадэвуш»","«Крымскія санеты»","«Дзяды»"],a:0},
{q:"Які твор Адама Міцкевіча названы прыкладам змагання з будзённасцю і імкнення да ідэалу?",o:["«Ода да маладосці»","«Пан Тадэвуш»","«Рыбка»","«Курган Марылі»"],a:0},
{q:"Хто з названых у тэксце пісьменнікаў напісаў «Курган Марылі»?",o:["Ян Баршчэўскі","Вінцэнт Дунін-Марцінкевіч","Адам Міцкевіч","Ян Чачот"],a:0},
{q:"Якія творы Яна Баршчэўскага згадваюцца ў тэксце?",o:["«Шляхціц Завальня» і «Рабункі мужыкоў»","«Пан Тадэвуш» і «Дзяды»","«Курган Марылі» і «Паўлінка»","«Людзі на балоце» і «Новая зямля»"],a:0},
{q:"Хто стварыў паэму «Песенька» («Лірнік вясковы»)?",o:["Ян Чачот","Адам Міцкевіч","Ян Баршчэўскі","Вінцэнт Дунін-Марцінкевіч"],a:0},
{q:"Які твор Вінцэнта Дуніна-Марцінкевіча названы ў тэксце?",o:["«Пінская шляхта»","«Дзяды»","«Крымскія санеты»","«Шляхціц Завальня»"],a:0},
{q:"Які твор Адама Міцкевіча быў напісаны ў 1828 годзе і згадваецца ў тэксце?",o:["«Конрад Валенрод»","«Пан Тадэвуш»","«Ода да маладосці»","«Рыбка»"],a:0},
{q:"Якая тэма асабліва звязана з рамантызмам у прыведзеным тэксце?",o:["Непрыманне будзённасці жыцця","Поўнае прыняцце будзённасці","Адмова ад індывідуальнасці","Адмова ад гістарычнай тэматыкі"],a:0}
];

let quiz=[], current=0, score=0, locked=false;

function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5)}

function start(){
  // Новы парадак пытанняў і адказаў пры кожным новым праходжанні.
  quiz=shuffle(questions).map(x=>{
    const options=x.o.map((text,index)=>({text,index}));
    const shuffled=shuffle(options);
    return {...x,o:shuffled.map(v=>v.text),a:shuffled.findIndex(v=>v.index===x.a)};
  });
  current=0; score=0; locked=false; showQuestion();
}

function showQuestion(){
  locked=false;
  const x=quiz[current];
  const percent=((current)/quiz.length)*100;
  document.getElementById("app").innerHTML=`
    <div class="top">
      <div class="badge">РАМАНТЫЗМ</div>
      <div class="counter">${current+1} / ${quiz.length}</div>
    </div>
    <div class="progress"><div style="width:${percent}%"></div></div>
    <h1>Праверка ведаў</h1>
    <p class="question">${x.q}</p>
    <div class="answers">
      ${x.o.map((v,i)=>`<button class="answer" onclick="choose(${i})">${v}</button>`).join("")}
    </div>
    <button class="next" id="next" onclick="nextQuestion()">Наступнае пытанне →</button>
  `;
}

function choose(i){
  if(locked)return;
  locked=true;
  const x=quiz[current];
  const buttons=document.querySelectorAll(".answer");
  buttons.forEach(b=>b.disabled=true);
  if(i===x.a){score++;buttons[i].classList.add("correct")}
  else {buttons[i].classList.add("wrong");buttons[x.a].classList.add("correct")}
  document.getElementById("next").style.display="block";
}

function nextQuestion(){
  current++;
  if(current>=quiz.length) showResult();
  else showQuestion();
}

function showResult(){
  const percent=Math.round(score/quiz.length*100);
  let msg=percent===100?"Выдатна! Усе адказы правільныя.":percent>=80?"Вельмі добры вынік!":percent>=60?"Добры вынік! Паўтары асноўныя паняцці і паспрабуй яшчэ раз.":"Паўтары матэрыял і паспрабуй яшчэ раз.";
  document.getElementById("app").innerHTML=`
    <div class="result">
      <div class="badge">ТЭСТ ЗАВЕРШАНЫ</div>
      <h2>Твой вынік</h2>
      <div class="score">${score}/${quiz.length}</div>
      <p>${percent}% правільных адказаў</p>
      <p>${msg}</p>
      <button class="restart" onclick="start()">↻ Прайсці яшчэ раз</button>
    </div>
  `;
}
start();
</script>
</body>
</html>
